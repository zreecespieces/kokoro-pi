[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kokoro-pi"
version = "1.0.0"
description = "Fast streaming Kokoro text to speech for Raspberry Pi, on the CPU"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Zachary Reece" }]
keywords = ["tts", "text-to-speech", "kokoro", "raspberry-pi", "onnx", "arm64", "neon"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "onnxruntime==1.30.0",
  "kokoro-onnx>=0.4.9,<0.5",
  "onnx>=1.17,<2",
  "numpy>=2.1,<3",
  "espeakng-loader>=0.2.4",
  "phonemizer-fork>=3.3.2",
]

[project.scripts]
kokoro-pi = "kokoro_pi.__main__:main"

[project.urls]
Homepage = "https://github.com/zreecespieces/kokoro-pi"
Issues = "https://github.com/zreecespieces/kokoro-pi/issues"

[tool.setuptools.packages.find]
where = ["src"]
