name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    name: compile operators (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: build the operator library
        run: bash native/build.sh libkokoro_pi_ops.so
      - name: check it exports the entry point
        run: nm -D native/libkokoro_pi_ops.so | grep RegisterCustomOps

  python:
    name: package imports and CLI responds
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: import every module
        run: |
          PYTHONPATH=src python -c "
          from kokoro_pi import assets, config, graph, openai, quantise, validate, server, build, wyoming
          print('imports ok')"
      - name: the CLI explains itself
        run: PYTHONPATH=src python -m kokoro_pi --help
      - name: configuration resolves in the documented order
        run: |
          cat > /tmp/kokoro-pi.toml <<'TOML'
          models = "/tmp/models"
          port = 9001
          voices = ["af_heart", "bf_emma"]
          [serve]
          threads = 3
          stream = false
          TOML
          PYTHONPATH=src KOKORO_PI_PORT=9999 python -c "
          import os
          from kokoro_pi import config as cfg

          # file < environment, and a [serve] table applies to serve
          s = cfg.resolve(cfg.SERVE, None, 'serve', '/tmp/kokoro-pi.toml')
          assert str(s.models) == '/tmp/models', s.models
          assert s.port == 9999, s.port
          assert 'environment' in s.sources['port'], s.sources['port']
          assert s.threads == 3 and s.stream is False, (s.threads, s.stream)
          assert s.voices == ['af_heart', 'bf_emma'], s.voices

          # environment < command line
          import argparse
          parser = argparse.ArgumentParser()
          cfg.add_arguments(parser, cfg.SERVE)
          args = parser.parse_args(['--port', '7000', '--no-stream', '--voices', 'af_heart'])
          s = cfg.resolve(cfg.SERVE, args, 'serve', '/tmp/kokoro-pi.toml')
          assert s.port == 7000 and s.sources['port'] == 'command line'
          assert s.voices == ['af_heart'] and s.stream is False

          # lists and booleans from the environment
          os.environ['KOKORO_PI_VOICES'] = 'am_adam, bf_emma'
          os.environ['KOKORO_PI_VERIFY'] = 'no'
          s = cfg.resolve(cfg.SERVE, None, 'serve', '/tmp/kokoro-pi.toml')
          assert s.voices == ['am_adam', 'bf_emma'], s.voices
          assert s.verify is False

          # a typo in the file is a startup error, not a silent default
          open('/tmp/bad.toml', 'w').write('prot = 1\n')
          try:
              cfg.resolve(cfg.SERVE, None, 'serve', '/tmp/bad.toml')
              raise AssertionError('expected an unknown-setting failure')
          except SystemExit as error:
              assert 'unknown setting' in str(error), error

          # the voice's own language, which is what auto is for
          assert cfg.language_for('bf_emma') == 'en-gb'
          assert cfg.language_for('af_heart') == 'en-us'
          assert cfg.language_for('bf_emma', 'en-us') == 'en-us'
          print('configuration ok')"

      - name: the config command explains itself
        run: |
          PYTHONPATH=src python -m kokoro_pi config
          PYTHONPATH=src python -m kokoro_pi config --markdown | head -3

      - name: the OpenAI translation layer behaves
        run: |
          PYTHONPATH=src python -c "
          import io, math, struct, wave
          from kokoro_pi import openai as oai

          buffer = io.BytesIO()
          with wave.open(buffer, 'wb') as out:
              out.setnchannels(1); out.setsampwidth(2); out.setframerate(24000)
              out.writeframes(b''.join(struct.pack('<h', int(12000 * math.sin(i * 0.08))) for i in range(24000)))
          wav = buffer.getvalue()

          # OpenAI's voice names, and a narrowed service that cannot honour one
          assert oai.resolve_voice('nova', ['af_nova', 'af_heart'], 'af_heart') == 'af_nova'
          assert oai.resolve_voice('bf_emma', ['bf_emma'], 'bf_emma') == 'bf_emma'
          assert oai.resolve_voice('nova', ['af_heart'], 'af_heart') is None
          assert oai.resolve_voice(None, ['af_heart'], 'af_heart') == 'af_heart'

          # Wider range than this model has, so clamp and say so
          assert oai.clamp_speed(4.0) == (2.0, True)
          assert oai.clamp_speed(1.0) == (1.0, False)
          assert oai.clamp_speed('quickly') == (1.0, True)

          # wav passes through; pcm is the caller's job, never mislabelled here
          assert oai.encode(wav, 'wav') == (wav, 'audio/wav', False)
          assert oai.encode(wav, 'pcm') == (wav, 'audio/wav', False)

          if oai.have_ffmpeg():
              data, kind, fell_back = oai.encode(wav, 'mp3')
              assert not fell_back and kind == 'audio/mpeg', (kind, fell_back)
              assert data[:3] == b'ID3' or data[:2] in (b'\xff\xfb', b'\xff\xf3'), data[:4]
              assert oai.encode(wav, 'flac')[0][:4] == b'fLaC'
              print('openai layer ok, with ffmpeg')
          else:
              data, kind, fell_back = oai.encode(wav, 'mp3')
              assert fell_back and kind == 'audio/wav' and data == wav
              print('openai layer ok, ffmpeg absent so mp3 falls back as documented')"

      - name: Wyoming events round-trip
        run: |
          PYTHONPATH=src python -c "
          import io, json
          from kokoro_pi import wyoming

          # A header, then JSON data, then a payload -- the three-part framing
          out = io.BytesIO()
          wyoming.write_event(out, 'audio-chunk', {'rate': 24000, 'width': 2, 'channels': 1}, b'abcd')
          wire = out.getvalue()
          header, rest = wire.split(b'\n', 1)
          assert json.loads(header)['payload_length'] == 4, header
          assert rest == b'abcd', rest

          kind, data = wyoming.read_event(io.BytesIO(wire))
          assert kind == 'audio-chunk' and data['rate'] == 24000, (kind, data)

          # data_length is merged over an inline data object
          extra = json.dumps({'text': 'hello'}).encode()
          framed = json.dumps({'type': 'synthesize', 'data': {'voice': {'name': 'af_heart'}},
                               'data_length': len(extra)}).encode() + b'\n' + extra
          kind, data = wyoming.read_event(io.BytesIO(framed))
          assert kind == 'synthesize' and data['text'] == 'hello' and data['voice']['name'] == 'af_heart', data

          assert wyoming.read_event(io.BytesIO(b'')) is None
          assert wyoming.read_event(io.BytesIO(b'not json\n')) is None

          class FakeEngine:
              variant = 'int8'
              def voices(self): return ['af_heart', 'bf_emma']
              def language_for(self, name): return {'a': 'en-us', 'b': 'en-gb'}[name[0]]

          engine = FakeEngine()
          info = wyoming.info_event(engine, engine.language_for)
          program = info['tts'][0]
          assert program['supports_synthesize_streaming'] is True
          assert [v['name'] for v in program['voices']] == ['af_heart', 'bf_emma']
          assert program['voices'][1]['languages'] == ['en-gb'], program['voices'][1]
          assert all(key in info for key in ('asr', 'tts', 'handle', 'intent', 'wake', 'mic', 'snd'))
          print('wyoming ok')"

      - name: the package builds, installs and exposes its own files
        run: |
          pipx run build --wheel
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist/*.whl
          /tmp/wheelcheck/bin/kokoro-pi --help > /dev/null
          /tmp/wheelcheck/bin/python -c "
          import kokoro_pi
          from kokoro_pi import paths
          print('version', kokoro_pi.__version__)
          # An installed package must find the build script and corpora it
          # shipped with, not paths relative to a checkout that is not there.
          assert paths.resource('corpus/english.json').exists()
          assert paths.resource('native/build.sh').exists()
          library = paths.prebuilt_library()
          print('kernel in the wheel:', library)
          assert library is not None and library.exists(), 'wheel has no operator library'
          # Kokoro is lazily exported: importing the package must not drag in
          # onnxruntime, but the name has to be reachable and discoverable.
          import sys
          assert 'onnxruntime' not in sys.modules, 'importing kokoro_pi loaded onnxruntime'
          assert 'Kokoro' in dir(kokoro_pi)
          print('packaging ok')"

      - name: calibration reduces over the right axes
        run: |
          cat > /tmp/instrument_check.py <<'PYEOF'
          """Calibration instrumentation must reduce over the right axes.

          The bug this exists for: the rank was taken from the weight initializer, which
          the height-one rewrite leaves 3-D feeding a 2-D convolution through an
          Unsqueeze. Reducing [0, 2] of a 4-D activation gives a "per-channel" peak of
          length C x W, and the only thing that caught it was a comparison against the
          old instrumentation on real audio.
          """
          import numpy as np
          import onnx
          from onnx import TensorProto, helper, numpy_helper

          from kokoro_pi import quantise

          # A convolution shaped like the ones in the rewritten generator: 4-D
          # activations, a 3-D weight initializer reaching it through Unsqueeze.
          weight = numpy_helper.from_array(np.zeros((8, 8, 3), np.float32), "conv.weight")
          axes = numpy_helper.from_array(np.array([2], np.int64), "unsqueeze.axes")
          graph = helper.make_graph(
              [
                  helper.make_node("Unsqueeze", ["conv.weight", "unsqueeze.axes"], ["w4"], name="/generator/unsq"),
                  helper.make_node("Conv", ["x", "w4"], ["y"], name="/generator/resblocks.0/convs1.0/Conv",
                                   dilations=[1, 1], pads=[0, 1, 0, 1], strides=[1, 1], group=1),
              ],
              "g",
              [helper.make_tensor_value_info("x", TensorProto.FLOAT, [1, 8, 1, 16])],
              [helper.make_tensor_value_info("y", TensorProto.FLOAT, [1, 8, 1, 16])],
              [weight, axes],
          )
          model = helper.make_model(graph, opset_imports=[helper.make_opsetid("", 20)])

          targets = quantise.find_targets(model, None)
          assert len(targets) == 1, targets
          assert targets[0]["rank"] == 4, f"rank came from the weight again: {targets[0]['rank']}"

          instrumented = quantise.instrument(model, targets)
          peaks = [o.name for o in instrumented.graph.output if o.name.endswith(quantise.PEAK)]
          assert len(peaks) == 1, [o.name for o in instrumented.graph.output]

          reduce_nodes = [n for n in instrumented.graph.node if n.op_type == "ReduceMax"]
          assert len(reduce_nodes) == 1, reduce_nodes
          initializers = {i.name: numpy_helper.to_array(i) for i in instrumented.graph.initializer}
          reduced = list(initializers[reduce_nodes[0].input[1]])
          assert reduced == [0, 2, 3], f"reducing the wrong axes: {reduced}"
          assert [a.i for a in reduce_nodes[0].attribute if a.name == "keepdims"] == [0]

          # And the raw tensor must still be accepted, so an older graph keeps working.
          raw = {"x": np.arange(8 * 4, dtype=np.float32).reshape(1, 8, 1, 4)}
          targets[0]["input"] = "x"
          ranges = quantise.accumulate_ranges(raw, targets, {})
          assert ranges[targets[0]["node"]].shape == (8,), ranges[targets[0]["node"]].shape

          onnx.checker.check_model(instrumented)
          print("instrumentation ok: rank 4, reduces [0, 2, 3], model valid")
          PYEOF
          PYTHONPATH=src python /tmp/instrument_check.py

      - name: streaming split behaves
        run: |
          PYTHONPATH=src python -c "
          from kokoro_pi.server import split_for_streaming
          pieces = split_for_streaming('One sentence here. And a second one, with a clause, following it.')
          assert len(pieces) == 2, pieces
          long = split_for_streaming('word ' * 200)
          assert all(len(p) <= 180 for p in long), [len(p) for p in long]
          assert split_for_streaming('no terminator') == ['no terminator']
          print('streaming split ok:', len(pieces), 'and', len(long), 'pieces')"
