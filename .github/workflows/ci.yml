name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    name: compile operators (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: build the operator library
        run: bash native/build.sh libkokoro_pi_ops.so
      - name: check it exports the entry point
        run: nm -D native/libkokoro_pi_ops.so | grep RegisterCustomOps

  python:
    name: package imports and CLI responds
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: import every module
        run: |
          PYTHONPATH=src python -c "
          from kokoro_pi import assets, config, graph, quantise, validate, server, build
          print('imports ok')"
      - name: the CLI explains itself
        run: PYTHONPATH=src python -m kokoro_pi --help
      - name: configuration resolves in the documented order
        run: |
          cat > /tmp/kokoro-pi.toml <<'TOML'
          models = "/tmp/models"
          port = 9001
          voices = ["af_heart", "bf_emma"]
          [serve]
          threads = 3
          stream = false
          TOML
          PYTHONPATH=src KOKORO_PI_PORT=9999 python -c "
          import os
          from kokoro_pi import config as cfg

          # file < environment, and a [serve] table applies to serve
          s = cfg.resolve(cfg.SERVE, None, 'serve', '/tmp/kokoro-pi.toml')
          assert str(s.models) == '/tmp/models', s.models
          assert s.port == 9999, s.port
          assert 'environment' in s.sources['port'], s.sources['port']
          assert s.threads == 3 and s.stream is False, (s.threads, s.stream)
          assert s.voices == ['af_heart', 'bf_emma'], s.voices

          # environment < command line
          import argparse
          parser = argparse.ArgumentParser()
          cfg.add_arguments(parser, cfg.SERVE)
          args = parser.parse_args(['--port', '7000', '--no-stream', '--voices', 'af_heart'])
          s = cfg.resolve(cfg.SERVE, args, 'serve', '/tmp/kokoro-pi.toml')
          assert s.port == 7000 and s.sources['port'] == 'command line'
          assert s.voices == ['af_heart'] and s.stream is False

          # lists and booleans from the environment
          os.environ['KOKORO_PI_VOICES'] = 'am_adam, bf_emma'
          os.environ['KOKORO_PI_VERIFY'] = 'no'
          s = cfg.resolve(cfg.SERVE, None, 'serve', '/tmp/kokoro-pi.toml')
          assert s.voices == ['am_adam', 'bf_emma'], s.voices
          assert s.verify is False

          # a typo in the file is a startup error, not a silent default
          open('/tmp/bad.toml', 'w').write('prot = 1\n')
          try:
              cfg.resolve(cfg.SERVE, None, 'serve', '/tmp/bad.toml')
              raise AssertionError('expected an unknown-setting failure')
          except SystemExit as error:
              assert 'unknown setting' in str(error), error

          # the voice's own language, which is what auto is for
          assert cfg.language_for('bf_emma') == 'en-gb'
          assert cfg.language_for('af_heart') == 'en-us'
          assert cfg.language_for('bf_emma', 'en-us') == 'en-us'
          print('configuration ok')"

      - name: the config command explains itself
        run: |
          PYTHONPATH=src python -m kokoro_pi config
          PYTHONPATH=src python -m kokoro_pi config --markdown | head -3

      - name: streaming split behaves
        run: |
          PYTHONPATH=src python -c "
          from kokoro_pi.server import split_for_streaming
          pieces = split_for_streaming('One sentence here. And a second one, with a clause, following it.')
          assert len(pieces) == 2, pieces
          long = split_for_streaming('word ' * 200)
          assert all(len(p) <= 180 for p in long), [len(p) for p in long]
          assert split_for_streaming('no terminator') == ['no terminator']
          print('streaming split ok:', len(pieces), 'and', len(long), 'pieces')"
